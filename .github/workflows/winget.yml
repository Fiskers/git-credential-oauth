name: Publish to WinGet
on:
  release:
    types: [released]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'hickford/git-credential-oauth'
    runs-on: windows-latest
    steps:
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: hickford.git-credential-oauth
          token: ${{ secrets.WINGET_TOKEN }}
